name: Verify FacetEdit
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and world workflow tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -v
      - name: Compile and package
        run: |
          python -m compileall -q src
          python scripts/build.py
          python dist/FacetEdit.pyz --diagnose
      - uses: actions/upload-artifact@v4
        with:
          name: facetedit-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.zip
  linux-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OS desktop test components
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Exercise native desktop widgets
        env:
          PYTHONPATH: src
          FACETEDIT_GUI_TESTS: '1'
        run: xvfb-run -a python3 -m unittest discover -v
